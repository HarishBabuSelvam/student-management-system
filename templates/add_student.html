{% extends "base.html" %}
{% block title %}Add Student — SMS{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">Add New Student</h1>
    <p class="text-muted">Fill in the student details below</p>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST" novalidate>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">First Name <span class="text-danger">*</span></label>
                    <input type="text" name="first_name" class="form-control"
                           value="{{ data.get('first_name', '') }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Last Name <span class="text-danger">*</span></label>
                    <input type="text" name="last_name" class="form-control"
                           value="{{ data.get('last_name', '') }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Email <span class="text-danger">*</span></label>
                    <input type="email" name="email" class="form-control"
                           value="{{ data.get('email', '') }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Phone <span class="text-danger">*</span></label>
                    <input type="tel" name="phone" class="form-control"
                           value="{{ data.get('phone', '') }}"
                           placeholder="10-digit number" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Department <span class="text-danger">*</span></label>
                    <select name="department" class="form-select" required>
                        <option value="">Select Department</option>
                        {% for dept in departments %}
                        <option value="{{ dept }}"
                            {% if data.get('department') == dept %}selected{% endif %}>
                            {{ dept }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Year <span class="text-danger">*</span></label>
                    <select name="year" class="form-select" required>
                        <option value="">Select Year</option>
                        {% for y in [1,2,3,4] %}
                        <option value="{{ y }}"
                            {% if data.get('year')|int == y %}selected{% endif %}>
                            Year {{ y }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Gender <span class="text-danger">*</span></label>
                    <select name="gender" class="form-select" required>
                        <option value="">Select Gender</option>
                        <option value="Male"   {% if data.get('gender') == 'Male'   %}selected{% endif %}>Male</option>
                        <option value="Female" {% if data.get('gender') == 'Female' %}selected{% endif %}>Female</option>
                        <option value="Other"  {% if data.get('gender') == 'Other'  %}selected{% endif %}>Other</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Date of Birth</label>
                    <input type="date" name="date_of_birth" class="form-control"
                           value="{{ data.get('date_of_birth', '') }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Address</label>
                    <textarea name="address" class="form-control" rows="3"
                              placeholder="Full address...">{{ data.get('address', '') }}</textarea>
                </div>
            </div>
            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save me-1"></i>Save Student
                </button>
                <a href="{{ url_for('students.student_list') }}" class="btn btn-outline-secondary">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
